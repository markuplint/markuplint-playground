# https://webcontainers.io/guides/configuring-headers#netlify
[[headers]]
    for = "/*"
    [headers.values]
        Cross-Origin-Embedder-Policy = "require-corp"
        Cross-Origin-Opener-Policy = "same-origin"

# The snapshot file name contains the markuplint version, so it never changes.
[[headers]]
    for = "/snapshot/*.bin"
    [headers.values]
        Content-Type = "application/octet-stream"
        Cache-Control = "public, max-age=31536000, immutable"

# The manifest points to the latest snapshot, so it must always be revalidated.
[[headers]]
    for = "/snapshot/manifest.json"
    [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"

[build.environment]
    # Keep in sync with "engines.node" in package.json (Netlify does not read it).
    NODE_VERSION = "24"
