name: Playground Test

on:
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Node.js
              id: setup-node
              uses: actions/setup-node@v4
              with:
                  node-version-file: package.json

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ./node_modules
                  key: depends-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Building Test
              run: yarn build

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Node.js
              id: setup-node
              uses: actions/setup-node@v4
              with:
                  node-version-file: package.json

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ./node_modules
                  key: depends-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint
